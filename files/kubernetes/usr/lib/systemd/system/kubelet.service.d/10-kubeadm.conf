[Service]
# kubelet-plugins dir is not created by kubeadm; do it here.
ExecStartPre=/usr/bin/mkdir -p /var/kubernetes/kubelet-plugins/volume/exec/
Environment="KUBELET_KUBECONFIG_ARGS=--bootstrap-kubeconfig=/etc/kubernetes/bootstrap-kubelet.conf --kubeconfig=/etc/kubernetes/kubelet.conf"
Environment="KUBELET_CONFIG_ARGS=--config=/var/lib/kubelet/config.yaml"
# This is a file that kubeadm dynamically sets with additional flags at
# join/init time. The file is created on first kubeadm init/join, and
# always overridden from there. Ensure to not change it manually.
EnvironmentFile=-/var/lib/kubelet/kubeadm-flags.env
# This is a file that the user can use to override kubelet args.
EnvironmentFile=-/etc/default/kubelet
ExecStart=
ExecStart=/usr/bin/kubelet $KUBELET_KUBECONFIG_ARGS $KUBELET_CONFIG_ARGS $KUBELET_KUBEADM_ARGS $KUBELET_EXTRA_ARGS
